<div class="app-window" id="TextApp">
  <div class="app-header"><span class="app-title">🔤 Text Tools</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="tx">
      <div class="tx-bar">
        <button data-op="upper">UPPER</button><button data-op="lower">lower</button><button data-op="title">Title</button>
        <button data-op="reverse">Reverse</button><button data-op="b64enc">Base64 ↑</button><button data-op="b64dec">Base64 ↓</button><button data-op="clear">Clear</button>
      </div>
      <textarea id="tx-text" placeholder="Type or paste text…" spellcheck="false"></textarea>
      <div id="tx-stats" class="tx-stats"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
